# Cabeceras de seguridad y cache

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # script-src permite el codigo en linea del configurador y los datos
    # estructurados JSON-LD. font-src y style-src son propios: ya no usamos Google Fonts.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gwyjwmedllseirtxprlp.supabase.co; font-src 'self'; connect-src 'self' https://gwyjwmedllseirtxprlp.supabase.co; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

# Las imagenes y tipografias llevan el nombre fijo: cache larga
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# El CSS cambia: cache corta y revalidacion
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Albarans signats pels clients (enllaç personal per WhatsApp): no indexar ni guardar a la memòria cau
[[headers]]
  for = "/a/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
