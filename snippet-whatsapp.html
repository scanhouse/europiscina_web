/* --- Contenedor: ancla abajo a la derecha. La burbuja se apila encima --- */
.ep-wa{
  --ep-wa-verde:#25D366;
  --ep-wa-verde-osc:#1EBE5A;
  --ep-wa-lado:20px;
  position:fixed;
  right:var(--ep-wa-lado);
  bottom:calc(var(--ep-wa-lado) + env(safe-area-inset-bottom,0px));
  z-index:9998;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:12px;
  pointer-events:none;
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.ep-wa > *{pointer-events:auto}

/* --- Botón redondo --- */
.ep-wa-btn{
  display:flex;align-items:center;justify-content:center;
  width:60px;height:60px;flex:0 0 60px;
  border-radius:50%;
  background:var(--ep-wa-verde);
  text-decoration:none;
  box-shadow:0 4px 14px rgba(37,211,102,.38),0 2px 6px rgba(0,0,0,.16);
  transition:background .18s ease,transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s ease;
}
.ep-wa-btn svg{width:32px;height:32px;fill:#fff;display:block}
.ep-wa-btn:hover,.ep-wa-btn:focus-visible{
  background:var(--ep-wa-verde-osc);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(37,211,102,.46),0 3px 8px rgba(0,0,0,.18);
}
.ep-wa-btn:focus-visible{outline:3px solid #0B4F6C;outline-offset:3px}
.ep-wa-btn:active{transform:translateY(0)}

/* --- Burbuja --- */
.ep-wa-burbuja{
  position:relative;
  display:none;
  max-width:min(272px,calc(100vw - (var(--ep-wa-lado) * 2)));
  background:#fff;
  border-radius:14px;
  box-shadow:0 10px 32px rgba(11,79,108,.20),0 2px 8px rgba(0,0,0,.08);
}
.ep-wa-burbuja.ep-wa-visible{
  display:block;
  animation:ep-wa-entrada .62s cubic-bezier(.22,1,.36,1) both;
}
/* pico apuntando al botón */
.ep-wa-burbuja::after{
  content:"";position:absolute;right:22px;bottom:-7px;
  width:14px;height:14px;background:#fff;transform:rotate(45deg);
  box-shadow:3px 3px 8px rgba(11,79,108,.07);
}
.ep-wa-texto{
  display:block;
  padding:15px 40px 15px 17px;
  text-decoration:none;
  color:#12262E;
  border-radius:14px;
}
.ep-wa-texto:focus-visible{outline:3px solid #0B4F6C;outline-offset:2px}
.ep-wa-t{
  display:block;font-size:.95rem;font-weight:600;line-height:1.3;
  letter-spacing:-.01em;color:#12262E;
}
.ep-wa-s{
  display:block;margin-top:3px;font-size:.8rem;font-weight:400;
  line-height:1.35;color:#5B6B72;
}
.ep-wa-x{
  position:absolute;top:6px;right:6px;
  width:30px;height:30px;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;border-radius:50%;
  cursor:pointer;color:#8A979D;
  transition:background .15s ease,color .15s ease;
}
.ep-wa-x svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;fill:none;display:block}
.ep-wa-x:hover{background:#F0F3F4;color:#12262E}
.ep-wa-x:focus-visible{outline:2px solid #0B4F6C;outline-offset:1px;color:#12262E}

@keyframes ep-wa-entrada{
  0%{opacity:0;transform:translateY(14px) scale(.94)}
  55%{opacity:1;transform:translateY(-5px) scale(1.015)}
  78%{transform:translateY(2px) scale(.998)}
  100%{opacity:1;transform:none}
}

/* --- Móvil: botón algo menor, burbuja a lo ancho disponible --- */
@media(max-width:520px){
  .ep-wa{--ep-wa-lado:16px;gap:10px}
  .ep-wa-btn{width:56px;height:56px;flex-basis:56px}
  .ep-wa-btn svg{width:30px;height:30px}
  .ep-wa-t{font-size:.92rem}
}

/* --- Sin animación si el sistema lo pide --- */
@media(prefers-reduced-motion:reduce){
  .ep-wa-burbuja.ep-wa-visible{animation:none}
  .ep-wa-btn{transition:background .18s ease}
  .ep-wa-btn:hover,.ep-wa-btn:focus-visible{transform:none}
}

/* --- Al imprimir, fuera --- */
@media print{.ep-wa{display:none}}
</style>

<div class="ep-wa" id="epWa" hidden>
  <div class="ep-wa-burbuja" id="epWaBurbuja">
    <a class="ep-wa-texto" id="epWaTexto" href="#" target="_blank" rel="noopener">
      <span class="ep-wa-t" id="epWaT"></span>
      <span class="ep-wa-s" id="epWaS"></span>
    </a>
    <button type="button" class="ep-wa-x" id="epWaX">
      <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13"/></svg>
    </button>
  </div>
  <a class="ep-wa-btn" id="epWaBtn" href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.6.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.5h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.22 3.08.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.28.17-1.41-.07-.13-.27-.2-.57-.35z"/>
      <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm0 18.15c-1.53 0-3.03-.41-4.34-1.19l-.31-.18-3.23.85.86-3.15-.2-.32a8.2 8.2 0 0 1-1.26-4.37c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.83 2.41a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24z"/>

<script>
(function(){
  "use strict";

  // ---- Configuración -------------------------------------------------
  var TELEFONO = "34680335438";      // WhatsApp de Europiscina, con prefijo
  var RETARDO  = 5000;               // ms hasta que aparece la burbuja
  var CLAVE    = "epWaBurbujaCerrada";

  var TEXTOS = {
    ca: {
      titulo: "Hola! Parlem de la teva piscina?",
      sub:    "Et responem al moment",
      aria:   "Contactar per WhatsApp",
      cerrar: "Tancar",
      msg: {
        poliester:   "Hola, m'interessa una piscina de polièster",
        obra:        "Hola, m'interessa una piscina d'obra o làmina armada",
        mantenimiento:"Hola, voldria informació de manteniment de piscina",
        riego:       "Hola, voldria informació de reg",
        general:     "Hola, vinc de la web d'Europiscina"
      }
    },
    es: {
      titulo: "¡Hola! ¿Hablamos de tu piscina?",
      sub:    "Te respondemos al momento",
      aria:   "Contactar por WhatsApp",
      cerrar: "Cerrar",
      msg: {
        poliester:   "Hola, me interesa una piscina de poliéster",
        obra:        "Hola, me interesa una piscina de obra o lámina armada",
        mantenimiento:"Hola, quería información de mantenimiento de piscina",
        riego:       "Hola, quería información de riego",
        general:     "Hola, vengo de la web de Europiscina"
      }
    },
    en: {
      titulo: "Hello! Shall we talk about your pool?",
      sub:    "We reply right away",
      aria:   "Contact us on WhatsApp",
      cerrar: "Close",
      msg: {
        poliester:   "Hello, I am interested in a fibreglass pool",
        obra:        "Hello, I am interested in a concrete or reinforced-membrane pool",
        mantenimiento:"Hello, I would like information about pool maintenance",
        riego:       "Hello, I would like information about irrigation",
        general:     "Hello, I am writing from the Europiscina website"
      }
    }
  };

  // Qué mensaje corresponde a cada tramo de URL.
  // El orden importa: gana la primera coincidencia.
  var RUTAS = [
    [/(poliester|poliester|polièster|fibreglass|configurador|pool-calculator)/, "poliester"],
    [/(piscinas-de-obra|piscines-obra|lamina-armada|gres-porcelanico|gres-porcellanic|reformas|reformes|concrete-pools)/, "obra"],
    [/(mantenimiento|manteniment|pool-maintenance|fugas-de-agua|fuites-aigua|leak)/, "mantenimiento"],
    [/(riego|reg\b|rec\b|hidrocenter|irrigation)/, "riego"]
  ];

  // ---- Detección -----------------------------------------------------
  var lang = (document.documentElement.getAttribute("lang") || "ca")
               .toLowerCase().slice(0,2);
  var T = TEXTOS[lang] || TEXTOS.ca;

  var ruta = (window.location.pathname || "/").toLowerCase();
  var contexto = "general";
  for (var i = 0; i < RUTAS.length; i++) {
    if (RUTAS[i][0].test(ruta)) { contexto = RUTAS[i][1]; break; }
  }

  var enlace = "https://wa.me/" + TELEFONO +
               "?text=" + encodeURIComponent(T.msg[contexto]);

  // ---- Montaje -------------------------------------------------------
  var caja    = document.getElementById("epWa");
  var burbuja = document.getElementById("epWaBurbuja");
  var btn     = document.getElementById("epWaBtn");
  var texto   = document.getElementById("epWaTexto");
  var cerrar  = document.getElementById("epWaX");
  if (!caja || !btn) { return; }

  btn.href = enlace;
  btn.setAttribute("aria-label", T.aria);
  texto.href = enlace;
  texto.setAttribute("aria-label", T.aria);
  document.getElementById("epWaT").textContent = T.titulo;
  document.getElementById("epWaS").textContent = T.sub;
  cerrar.setAttribute("aria-label", T.cerrar);
  caja.hidden = false;

  // ---- Medición ------------------------------------------------------
  function medir(origen){
    try {
      if (typeof window.gtag === "function") {
        window.gtag("event", "whatsapp_click", {
          page_path: window.location.pathname,
          page_location: window.location.href,
          page_title: document.title,
          origen: origen,         // "boton" o "burbuja"
          contexto: contexto,     // poliester | obra | mantenimiento | riego | general
          idioma: lang
        });
      }
    } catch (e) { /* sin analítica, seguimos */ }
  }
  btn.addEventListener("click",   function(){ medir("boton"); });
  texto.addEventListener("click", function(){ medir("burbuja"); ocultar(false); });

  // ---- Burbuja -------------------------------------------------------
  function leerCerrada(){
    try { return window.sessionStorage.getItem(CLAVE) === "1"; }
    catch (e) { return false; }
  }
  function marcarCerrada(){
    try { window.sessionStorage.setItem(CLAVE, "1"); } catch (e) { /* modo privado */ }
  }
  function ocultar(persistir){
    burbuja.classList.remove("ep-wa-visible");
    if (persistir) { marcarCerrada(); }
  }

  cerrar.addEventListener("click", function(){
    ocultar(true);
    btn.focus();
  });

  // Escape cierra la burbuja igual que la X
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape" && burbuja.classList.contains("ep-wa-visible")) {
      ocultar(true);
      btn.focus();
    }
  });

  if (!leerCerrada()) {
    window.setTimeout(function(){
      if (!leerCerrada()) { burbuja.classList.add("ep-wa-visible"); }
    }, RETARDO);
  }
})();
</script>
